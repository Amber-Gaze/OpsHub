main: 
  monitoring_port: 8100

gateway:
  http_port: 8001
  grpc_port: 8002
  monitoring_port: 8003
  log_file_name: "ops_hub_gateway.log"
  # 可选：不填则按 auth / config_center 的 http_port 自动拼 127.0.0.1
  # auth_base_url: "http://127.0.0.1:8004"
  # config_center_base_url: "http://127.0.0.1:8007"

auth:
  http_port: 8004
  grpc_port: 8005
  monitoring_port: 8006
  log_file_name: "ops_hub_auth.log"

config_center:
  http_port: 8007
  grpc_port: 8008
  monitoring_port: 8009
  log_file_name: "ops_hub_config.log"

logger:
  log_dir: "./logs"
  log_file_name: "ops_hub.log"
  max_size: 10
  max_backups: 5
  max_age: 7
  log_level: "info"
  compress: false

mysql:
  host: "localhost"
  port: 3306
  user: "root"
  password: "liya1234"
  database: "opshub_db"

redis:
  host: "localhost"
  port: 6379
  password: "liya1234"
  db: 0

