main: 
  monitoring_port: 8100
  shutdown_timeout_seconds: 20

gateway:
  http_port: 8001
  grpc_port: 8002
  monitoring_port: 8003
  log_file_name: "ops_hub_gateway.log"
  # 可选：不填则按 auth / config_center 的 http_port 自动拼 127.0.0.1
  # auth_base_url: "http://127.0.0.1:8004"
  # config_center_base_url: "http://127.0.0.1:8007"

auth:
  http_port: 8004
  grpc_port: 8005
  monitoring_port: 8006
  log_file_name: "ops_hub_auth.log"
  # 引导管理员（可选）：首次启动若库中无该用户则创建为管理员；密码为密文，勿写明文。
  # 生成密文: go run ./cmd/opshub-bootstrap-encrypt -key '你的主密钥' -password '管理员密码'
  # 运行时主密钥: export OPSHUB_BOOTSTRAP_CIPHER_KEY='你的主密钥' （或填下方 bootstrap_cipher_key，勿提交到 git）
  # bootstrap_admin_username: "admin"
  # bootstrap_admin_password_cipher: "BASE64_FROM_ENCRYPT_TOOL"
  # bootstrap_admin_email: "admin@example.com"
  # bootstrap_cipher_key: ""   # 不推荐入库，优先用环境变量

config_center:
  http_port: 8007
  grpc_port: 8008
  monitoring_port: 8009
  log_file_name: "ops_hub_config.log"

logger:
  log_dir: "./logs"
  log_file_name: "ops_hub.log"
  max_size: 10
  max_backups: 5
  max_age: 7
  log_level: "info"
  compress: false

mysql:
  host: "localhost"
  port: 3306
  user: "root"
  password: "liya1234"
  database: "opshub_db"

redis:
  host: "localhost"
  port: 6379
  password: "liya1234"
  db: 0

# 可选：填写 endpoints 后配置中心将使用 etcd 持久化（需本地或集群 etcd 可达）
# etcd:
#   endpoints:
#     - "127.0.0.1:2379"
#   prefix: "/opshub/config"