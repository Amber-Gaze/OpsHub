main:
  # 优雅退出等待在途请求的最长时间（秒）
  shutdown_timeout_seconds: 20

gateway:
  http_port: 8001
  grpc_port: 8002   # 预留，暂未启用 gRPC
  monitoring_port: 8003 # pprof 诊断端口
  log_file_name: "ops_hub_gateway.log"
  # 可选：不填则按 auth / config_center 的 http_port 自动拼 127.0.0.1
  # auth_base_url: "http://127.0.0.1:8101"
  # config_center_base_url: "http://127.0.0.1:8201"

auth:
  http_port: 8101
  grpc_port: 8102   # 预留，暂未启用 gRPC
  monitoring_port: 8103 # pprof 诊断端口
  log_file_name: "ops_hub_auth.log"
  # 引导管理员（可选）：首次启动若库中无该用户则创建为管理员；密码为密文，勿写明文。
  # 生成密文: go run ./cmd/opshub-bootstrap-encrypt -key '你的主密钥' -password '管理员密码'
  # 运行时主密钥: export OPSHUB_BOOTSTRAP_CIPHER_KEY='你的主密钥' （或填下方 bootstrap_cipher_key，勿提交到 git）
  # bootstrap_admin_username: "admin"
  # bootstrap_admin_password_cipher: "BASE64_FROM_ENCRYPT_TOOL"
  # bootstrap_admin_email: "admin@example.com"
  # bootstrap_cipher_key: ""   # 不推荐入库，优先用环境变量

config_center:
  http_port: 8201
  grpc_port: 8202   # 预留，暂未启用 gRPC
  monitoring_port: 8203 # pprof 诊断端口
  log_file_name: "ops_hub_config.log"

logger:
  log_dir: "./logs"
  log_file_name: "ops_hub.log"
  rotation: "hour"      # 轮转精度: minute | hour | day
  max_backups: 30       # 最多保留的历史文件数
  max_age: 7            # 保留天数
  log_level: "info"     # debug | info | warn | error
  encoding: "json"      # json | console
  compress: false       # 轮转后是否 gzip 压缩

mysql:
  host: "localhost"
  port: 3306
  user: "root"
  # 本地练习可直接写密码；生产建议改用环境变量注入
  password: "liya1234"
  database: "opshub_db"

# Redis：作为配置中心 L1 读缓存（etcd 主存 + Redis 混存）与 IAM 登出令牌黑名单。
# enabled: nil=自动（尝试连接，失败则降级不启用）；true=强制；false=禁用
redis:
  host: "localhost"
  port: 6379
  password: "liya1234"
  db: 0
  enabled: true

# 配置中心主存储（etcd）：本地 docker 三件套（docker compose up -d）
etcd:
  endpoints:
    - "127.0.0.1:2379"
  prefix: "/opshub/config"